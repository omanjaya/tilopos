# Staging overlay for TiloPOS
#   kubectl kustomize k8s/overlays/staging | kubectl apply -f -
# Before the first apply: create Secrets `tilopos-secrets` and `tilopos-backup` in
# namespace tilopos-staging (see k8s/README.md). Staging runs NODE_ENV=production
# so the same env validation applies; use gateway sandbox keys via PAYMENT_GATEWAY=xendit.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: tilopos-staging

resources:
  - ../../base

namePrefix: staging-

labels:
  - pairs:
      environment: staging

patches:
  - target:
      kind: Ingress
      name: tilopos-ingress
    patch: |-
      - op: replace
        path: /spec/tls/0/hosts
        value:
          - staging.tilopos.id
          - api-staging.tilopos.id
      - op: replace
        path: /spec/rules/0/host
        value: staging.tilopos.id
      - op: replace
        path: /spec/rules/1/host
        value: api-staging.tilopos.id
  # No nightly backups for staging
  - target:
      kind: CronJob
      name: tilopos-db-backup
    patch: |-
      - op: add
        path: /spec/suspend
        value: true

configMapGenerator:
  - name: tilopos-config
    behavior: merge
    literals:
      - LOG_LEVEL=debug
      - CORS_ORIGIN=https://staging.tilopos.id
      - FRONTEND_URL=https://staging.tilopos.id
      - REDIS_HOST=staging-tilopos-redis
  - name: tilopos-web-config
    behavior: merge
    literals:
      - BACKEND_UPSTREAM=http://staging-tilopos-backend

images:
  - name: ghcr.io/tilopos/backend
    newTag: "0.1.0"
  - name: ghcr.io/tilopos/web
    newTag: "0.1.0"
