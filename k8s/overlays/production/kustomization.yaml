# Production overlay for TiloPOS
#   kubectl kustomize k8s/overlays/production | kubectl apply -f -
# Before the first apply: create Secrets `tilopos-secrets` and `tilopos-backup` in
# namespace tilopos-production (see k8s/README.md).
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: tilopos-production

resources:
  - ../../base

namePrefix: prod-

labels:
  - pairs:
      environment: production

patches:
  # Backend - more replicas and resources
  - target:
      kind: Deployment
      name: tilopos-backend
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 3
      - op: replace
        path: /spec/template/spec/containers/0/resources/requests/cpu
        value: 250m
      - op: replace
        path: /spec/template/spec/containers/0/resources/requests/memory
        value: 512Mi
      - op: replace
        path: /spec/template/spec/containers/0/resources/limits/cpu
        value: 2000m
      - op: replace
        path: /spec/template/spec/containers/0/resources/limits/memory
        value: 2Gi

  - target:
      kind: HorizontalPodAutoscaler
      name: tilopos-backend-hpa
    patch: |-
      - op: replace
        path: /spec/minReplicas
        value: 3
      - op: replace
        path: /spec/maxReplicas
        value: 20

  - target:
      kind: Deployment
      name: tilopos-web
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 3

  - target:
      kind: Ingress
      name: tilopos-ingress
    patch: |-
      - op: replace
        path: /spec/tls/0/hosts
        value:
          - app.tilopos.id
          - api.tilopos.id
      - op: replace
        path: /spec/rules/0/host
        value: app.tilopos.id
      - op: replace
        path: /spec/rules/1/host
        value: api.tilopos.id

configMapGenerator:
  - name: tilopos-config
    behavior: merge
    literals:
      - NODE_ENV=production
      - LOG_LEVEL=warn
      - CORS_ORIGIN=https://app.tilopos.id
      - FRONTEND_URL=https://app.tilopos.id
      # Service names carry the overlay namePrefix
      - REDIS_HOST=prod-tilopos-redis
  - name: tilopos-web-config
    behavior: merge
    literals:
      - BACKEND_UPSTREAM=http://prod-tilopos-backend

images:
  # Set by CD to the released tag or, better, a digest (kustomize edit set image ...)
  - name: ghcr.io/tilopos/backend
    newTag: "0.1.0"
  - name: ghcr.io/tilopos/web
    newTag: "0.1.0"
