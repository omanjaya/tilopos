apiVersion: apps/v1
kind: Deployment
metadata:
  name: tilopos-backend
  labels:
    app: tilopos-backend
    component: api
spec:
  replicas: 2
  selector:
    matchLabels:
      app: tilopos-backend
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: tilopos-backend
        component: api
    spec:
      serviceAccountName: tilopos-backend
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 40
      securityContext:
        # Matches the `node` user (1000:1000) in packages/backend/Dockerfile
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        # Applies pending Prisma migrations before the app starts. `prisma migrate deploy`
        # takes a Postgres advisory lock, so concurrent pods serialize and the later ones
        # are no-ops. The image CMD no longer migrates.
        - name: migrate
          image: ghcr.io/tilopos/backend
          imagePullPolicy: IfNotPresent
          command: ["/app/node_modules/.bin/prisma", "migrate", "deploy"]
          workingDir: /app/packages/backend
          envFrom:
            - configMapRef:
                name: tilopos-config
            - secretRef:
                name: tilopos-secrets
          env:
            - name: HOME
              value: /tmp
            - name: CHECKPOINT_DISABLE
              value: "1"
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      containers:
        - name: backend
          image: ghcr.io/tilopos/backend
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3001
              name: http
              protocol: TCP
          envFrom:
            - configMapRef:
                name: tilopos-config
            - secretRef:
                name: tilopos-secrets
          env:
            - name: HOME
              value: /tmp
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 1000m
              memory: 1Gi
          startupProbe:
            httpGet:
              path: /api/v1/health/live
              port: http
            periodSeconds: 5
            failureThreshold: 30
          livenessProbe:
            httpGet:
              path: /api/v1/health/live
              port: http
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /api/v1/health/ready
              port: http
            periodSeconds: 5
            timeoutSeconds: 3
            successThreshold: 1
            failureThreshold: 3
          lifecycle:
            preStop:
              # Let the Service/ingress stop routing before SIGTERM (enableShutdownHooks drains)
              exec:
                command: ["sleep", "5"]
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: logs
              mountPath: /app/packages/backend/logs
            - name: uploads
              mountPath: /app/packages/backend/uploads
      volumes:
        - name: tmp
          emptyDir: {}
        - name: logs
          emptyDir: {}
        - name: uploads
          persistentVolumeClaim:
            claimName: tilopos-uploads
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchLabels:
                    app: tilopos-backend
                topologyKey: kubernetes.io/hostname
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app: tilopos-backend
