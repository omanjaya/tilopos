apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: tilopos-ingress
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/proxy-body-size: "50m"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "60"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "60"
    # Per-client-IP limit at the edge; the API has its own per-route throttling.
    # A whole outlet often shares one NAT IP, so keep this generous.
    nginx.ingress.kubernetes.io/limit-rpm: "1200"
    nginx.ingress.kubernetes.io/limit-burst-multiplier: "3"
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - app.tilopos.id
        - api.tilopos.id
      secretName: tilopos-tls
  rules:
    - host: app.tilopos.id
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: tilopos-web
                port:
                  name: http
    - host: api.tilopos.id
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: tilopos-backend
                port:
                  name: http
