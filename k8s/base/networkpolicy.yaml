# Ingress-only isolation for the namespace. Egress stays open because the backend
# needs the managed Postgres, S3, SMTP and payment gateways.
# Adjust the namespace labels if your ingress controller / Prometheus live elsewhere.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-ingress
spec:
  podSelector: {}
  policyTypes: ["Ingress"]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: tilopos-web-ingress
spec:
  podSelector:
    matchLabels:
      app: tilopos-web
  policyTypes: ["Ingress"]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ingress-nginx
      ports:
        - port: 8080
          protocol: TCP
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: tilopos-backend-ingress
spec:
  podSelector:
    matchLabels:
      app: tilopos-backend
  policyTypes: ["Ingress"]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ingress-nginx
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: monitoring
        - podSelector:
            matchLabels:
              app: tilopos-web
      ports:
        - port: 3001
          protocol: TCP
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: tilopos-redis-ingress
spec:
  podSelector:
    matchLabels:
      app: tilopos-redis
  policyTypes: ["Ingress"]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: tilopos-backend
      ports:
        - port: 6379
          protocol: TCP
