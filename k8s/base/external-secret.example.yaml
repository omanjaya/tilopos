# Example: sync `tilopos-secrets` from an external secret manager with
# External Secrets Operator (https://external-secrets.io). Not referenced by the
# kustomization - copy it into your GitOps repo / overlay and adjust the store and keys.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: tilopos-secrets
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: tilopos-store
  target:
    name: tilopos-secrets
    creationPolicy: Owner
  # One JSON object per environment holding every key listed in secrets.yaml.example
  dataFrom:
    - extract:
        key: tilopos/production/backend
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: tilopos-backup
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: tilopos-store
  target:
    name: tilopos-backup
    creationPolicy: Owner
  dataFrom:
    - extract:
        key: tilopos/production/backup
